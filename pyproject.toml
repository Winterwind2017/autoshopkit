[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshopkit"
version = "0.1.0"
description = "Inovance AutoShop V4.11 automation kernel: file formats + UI channel + verified gates"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Winterwind2017" }]
dependencies = []

[project.optional-dependencies]
ui = ["comtypes>=1.4", "pywin32>=306", "frida>=16"]
dev = ["pytest>=8"]

[project.scripts]
autoshopkit = "autoshopkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
